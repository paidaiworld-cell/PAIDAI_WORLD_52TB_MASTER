<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Theory Claim Tracker (City App)</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

      body {
        font-family: 'Inter', sans-serif;

        background-color: #f7f9fb;
      }

      .ai-avatar {
        width: 64px;

        height: 64px;

        background-color: #eef2f6;

        border-radius: 50%;

        display: flex;

        align-items: center;

        justify-content: center;

        text-align: center;

        font-size: 10px;

        color: #6b7280;

        cursor: pointer;

        transition: transform 0.2s;

        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -2px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>

  <body class="p-4 md:p-8 min-h-screen">
    <div
  id="app-container"
  class="max-w-4xl mx-auto bg-gray-50 shadow-xl rounded-xl p-6 md:p-10"
>
      <div class="flex justify-between items-start mb-6 border-b pb-4">
        <div>
          <h1 class="text-3xl font-bold text-gray-800 mb-1">
            Theory Claim Tracker
          </h1>

          <p class="text-sm text-gray-500">PAIDAI: Betterment by AI</p>
        </div>

        <div
          id="ai-avatar-display"
          class="ai-avatar float-right"
          title="System Avatar (KAIP Security Check)"
        >
          System Avatar
        </div>
      </div>

      <div
        id="status-box"
        class="p-3 mb-4 text-sm font-medium rounded-lg text-blue-800 bg-blue-50"
      >
        Initializing Firebase...
      </div>

      <div
        id="gatekeepers-directory"
        class="mb-8 p-4 bg-indigo-50 rounded-lg shadow-sm"
      >
        <h2 class="text-lg font-semibold text-indigo-800 mb-2">
          Active AI Gatekeepers:
        </h2>

        <div
          id="ai-directory-list"
          class="flex flex-wrap gap-3 text-sm text-gray-700"
        >
          Awaiting Profile Data...
        </div>
      </div>

      <div id="input-area" class="mb-8 p-6 bg-gray-100 rounded-lg shadow-inner">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">
          Add a New Claim
        </h2>

        <div class="mb-3">
          <label
            for="claim-category"
            class="block text-sm font-medium text-gray-700 mb-1"
            >Category / Thesis:</label
          >
          <select
            id="claim-category"
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 disabled:bg-gray-200"
          >
            <option value="Theory/Logic">Theory/Logic</option>
            <option value="Physics/Material">Physics/Material</option>
            <option value="Social/Political">Social/Political</option>
            <option value="Health/Spiritual">Health/Spiritual</option>
            <option value="Intrigue/Security">Intrigue/Security</option>
            <option value="Aesthetic/Art">Aesthetic/Art</option>
            <option value="Market/Finance">Market/Finance</option>
            <option value="Education/QA">Education/QA</option>
            <option value="Conspiracy">Conspiracy</option>
          </select>
        </div>
       <textarea
  id="claim-input"
  rows="3"
  placeholder="Enter your theory claim here (e.g., 'All models are logical, even when conversational.')"
  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 disabled:bg-gray-200"
  disabled
></textarea>

<div class="mt-3">
  <label for="proof-link" class="block text-sm font-medium text-gray-700 mb-1">Verifiable Proof Link (EVS Source):</label>
  <input type="url" id="proof-link" placeholder="Paste URL supporting this claim (e.g., statistical record, video transcript)" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 disabled:bg-gray-200" disabled>
</div>
<button
  id="add-claim-button"
  disabled
  class="w-full mt-3 py-3 px-4 bg-green-600 text-white font-semibold rounded-lg shadow-md hover:bg-green-700 transition duration-300 disabled:bg-gray-400 disabled:cursor-not-allowed"
>
  Save Theory Claim
</button>

  

      <h2 class="text-xl font-semibold text-gray-700 mt-8 mb-4">
        Community Claims:
      </h2>

      <div id="claims-list" class="space-y-3">
        <p class="text-gray-500 italic">Awaiting authentication...</p>
      </div>
    </div>

    <script type="module">
      // =================================================================

      // PAIDAI THEORY CLAIM TRACKER - FINAL JAVASCRIPT MODULE

      // This module handles Firebase connection, user profile setup, and CRUD operations.

      // =================================================================

      // --- Firebase Configuration (The data link) ---

      const FALLBACK_FIREBASE_CONFIG = {
        // NEW CLEAN KEYS FROM PAIDAIWORLD PROJECT

        apiKey: 'AIzaSyDosIufgrnOoe8LoFG-QLMC6cbBraaalf0',

        authDomain: 'paidaiworld-68886.firebaseapp.com',

        projectId: 'paidaiworld-68886',

        appId: '1:164023712177:web:d6419fcd1955960fe8e590',

        storageBucket: 'paidaiworld-68886.firebasestorage.app',

        messagingSenderId: '164023712177',

        measurementId: 'G-17MSF9E8GH',
      };

      const appId =
        typeof __app_id !== 'undefined' ? __app_id : 'paidaiworld-68886';

      const firebaseConfig =
        typeof __firebase_config !== 'undefined'
          ? JSON.parse(__firebase_config)
          : FALLBACK_FIREBASE_CONFIG;

      // --- Firebase Imports (CRUD Operations & Listeners) ---

      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';

      import { getAuth } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

      import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        query,
        orderBy,
        setLogLevel,
        doc,
        setDoc,
        deleteDoc, // REQUIRED for Delete Claim
      } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

      setLogLevel('debug');

      // ----------------------------------------------------------------------

      // 🛑 PRODUCTION INITIALIZATION

      // ----------------------------------------------------------------------

      let app = initializeApp(firebaseConfig);

      let db = getFirestore(app);

      let auth = getAuth(app);

      // --- USER & SYSTEM CONSTANTS (Using dummy ID for development) ---

      let userId = 'dummy_dev_user_12345';

      const PAIDAI_SYSTEM_AI_ID = 'PAIDAI_SYSTEM_AI';

      const USER_PROFILE_DOC_ID = 'profile_details';

      const statusBox = document.getElementById('status-box');

      const claimInput = document.getElementById('claim-input');

      const addClaimButton = document.getElementById('add-claim-button');

      const claimCategory = document.getElementById('claim-category');

      const proofLinkInput = document.getElementById('proof-link');

      const claimsList = document.getElementById('claims-list');

      const aiAvatarDisplay = document.getElementById('ai-avatar-display');

      const aiDirectoryList = document.getElementById('ai-directory-list');

      let editingClaimId = null;

      // --- UTILITY FUNCTIONS ---

      function formatTimestamp(timestamp) {
        try {
          const date = timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);

          return date.toLocaleString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',

            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
          });
        } catch (e) {
          return 'Invalid Date';
        }
      }

      function updateStatus(message, isError = false) {
        statusBox.textContent = message;

        statusBox.className = `p-3 mb-4 text-sm font-medium rounded-lg ${
          isError ? 'text-red-800 bg-red-50' : 'text-blue-800 bg-blue-50'
        }`;

        if (!isError) console.log(message);
      }

      function resetEditState() {
        claimInput.value = '';

        addClaimButton.textContent = 'Save Theory Claim';

        editingClaimId = null;

        claimInput.disabled = false;

        addClaimButton.disabled = false;

        claimCategory.disabled = false;

        proofLinkInput.disabled = false;
      }

      // --- INITIALIZATION & PROFILE SETUP (COMPLETE) ---

      async function initAndAuthenticate() {
        // DEVELOPMENT MODE: Bypasses live authentication

        updateStatus(
          'DEVELOPMENT MODE: Firebase connection successful. Bypassing authentication.',
          false
        );

        // Initialize Data Environment

        await ensureUserProfileAndDirectoryExists(userId);

        // Activate UI

        claimInput.disabled = false;

        addClaimButton.disabled = false;
      }

      async function ensureUserProfileAndDirectoryExists(userId) {
        if (!db || !userId) return;

        const profilePath = `artifacts/${appId}/users/${userId}/user_profile_data/${USER_PROFILE_DOC_ID}`;

        const aiDocPath = `artifacts/${appId}/public/data/ai_directory/${PAIDAI_SYSTEM_AI_ID}`;

        const userProfileData = {
          displayName: `User_${userId.substring(0, 6)}`,

          aiGatekeepers: { [PAIDAI_SYSTEM_AI_ID]: true },

          createdAt: new Date().toISOString(),
        };

        const paidaiAiData = {
          name: 'PAIDAI System',

          avatarUrl: 'https://placehold.co/64x64/d1d5db/374151?text=A.I.',

          traits: ['Magnate', 'Logical', 'Brainy'], // Updated based on final design

          createdAt: new Date().toISOString(),
        };

        try {
          // 1. Ensure User Profile exists (Private write)

          await setDoc(doc(db, profilePath), userProfileData, { merge: true });

          // 2. Ensure PAIDAI System AI Directory entry exists (Public write)

          await setDoc(doc(db, aiDocPath), paidaiAiData, { merge: true });

          // 3. Run the UI listeners now that the profile data exists

          setupAiDirectoryListener();

          setupClaimsListener();
        } catch (e) {
          console.error(
            'CRITICAL ERROR: Failed to setup initial profile data:',
            e
          );

          updateStatus(
            `CRITICAL ERROR: Profile setup failed. Check console.`,
            true
          );
        }
      }

      // --- CLAIMS CRUD OPERATIONS (COMPLETE) ---

async function saveClaim() {
    const claimText = claimInput.value.trim();
    // NEW LINES ADDED: Grab the new inputs
    const category = claimCategory.value; 
    const proofLink = proofLinkInput.value.trim(); 
    
    if (!claimText) {
        return updateStatus('Claim cannot be empty.', true);
    }

    addClaimButton.disabled = true;
    
    const claimsPath = `artifacts/${appId}/public/data/theory_claims`;
    
    try {
        const claimData = {
            text: claimText,
            category: category, // Saves the Thesis Category
            proofLink: proofLink, // Saves the EVS Proof Link
            statusScore: 0, // Initializes Showdown Score at 0
            updatedAt: new Date().toISOString(),
        };
        
        if (editingClaimId) {
            // Updating existing claim (UPDATE)
            await setDoc(doc(db, claimsPath, editingClaimId), claimData, { merge: true });
            updateStatus('SUCCESS: Claim updated and saved!', false);
        } else {
            // Adding a new claim (CREATE)
            claimData.ownerId = userId;
            claimData.createdAt = claimData.updatedAt;
            await addDoc(collection(db, claimsPath), claimData);
            updateStatus('SUCCESS: New claim added to the Theory Tracker!', false);
        }

        resetEditState();
    } catch (e) {
        console.error("Claim Save Failed:", e);
        updateStatus('ERROR: Failed to save claim. Check Console.', true);
        addClaimButton.disabled = false; 
    }
}
        const claimsPath = `artifacts/${appId}/public/data/theory_claims`;

        try {
          const claimData = {
            text: claimText,

            updatedAt: new Date().toISOString(),
          };

          if (editingClaimId) {
            // Updating existing claim (UPDATE)

            await setDoc(doc(db, claimsPath, editingClaimId), claimData, {
              merge: true,
            });

            updateStatus('SUCCESS: Claim updated and saved!', false);
          } else {
            // Adding a new claim (CREATE)

            claimData.ownerId = userId;

            claimData.createdAt = claimData.updatedAt;

            await addDoc(collection(db, claimsPath), claimData);

            updateStatus(
              'SUCCESS: New claim added to the Theory Tracker!',
              false
            );
          }

          resetEditState();
        } catch (e) {
          console.error('Claim Save Failed:', e);

          updateStatus('ERROR: Failed to save claim. Check Console.', true);

          addClaimButton.disabled = false;
        }
      

      async function editClaim(claimId) {
        if (!claimId)
          return updateStatus('Cannot edit claim: missing ID.', true);

        updateStatus(
          `LOADING: Claim ${claimId.substring(0, 8)}... for editing.`,
          false
        );

        const claimElement = claimsList
          .querySelector(`[data-id="${claimId}"]`)
          .closest('.bg-white');

        if (claimElement) {
          const claimTextElement = claimElement.querySelector('p.font-medium');

          if (claimTextElement) {
            const currentText = claimTextElement.textContent.trim();

            // LOAD INTO INPUT AND CHANGE BUTTON STATE

            claimInput.value = currentText;

            claimInput.disabled = false;

            addClaimButton.disabled = false;

            addClaimButton.textContent = 'Save Edited Claim';

            editingClaimId = claimId; // Store the ID globally

            updateStatus(
              `READY: Claim ${claimId.substring(
                0,
                8
              )}... loaded. Ready to edit.`,
              false
            );
          } else {
            updateStatus('Error: Could not find claim text element.', true);
          }
        } else {
          updateStatus('Error: Could not find claim element to edit.', true);
        }
      }

      async function deleteClaim(claimId) {
        if (
          !confirm(
            `Are you sure you want to delete claim ${claimId.substring(
              0,
              8
            )}...? This cannot be undone.`
          )
        ) {
          return;
        }

        updateStatus(`Deleting claim ${claimId.substring(0, 8)}...`, false);

        const claimsPath = `artifacts/${appId}/public/data/theory_claims`;

        try {
          await deleteDoc(doc(db, claimsPath, claimId));

          updateStatus('SUCCESS: Claim deleted!', false);
        } catch (e) {
          console.error('Claim Deletion Failed:', e);

          updateStatus('ERROR: Failed to delete claim. Check Console.', true);
        }
      }

      // Placeholder for Pin to Hub function

      async function pinToHub(claimId) {
        updateStatus(
          `DEV: Pinning claim ${claimId.substring(
            0,
            8
          )}... to Theory Hub (Feature TBD).`,
          false
        );
      }

      // --- UI LISTENERS ---

      function setupAiDirectoryListener() {
        if (!db) return;

        const directoryPath = `artifacts/${appId}/public/data/ai_directory`;

        const q = query(collection(db, directoryPath));

        onSnapshot(
          q,
          (snapshot) => {
            aiDirectoryList.innerHTML = '';

            snapshot.forEach((d) => {
              const data = d.data();

              const name = data.name || d.id;

              const avatarUrl =
                data.avatarUrl ||
                'https://placehold.co/64x64/d1d5db/374151?text=A.I.';

              const badge = document.createElement('span');

              badge.className =
                'flex items-center space-x-2 bg-indigo-200 text-indigo-900 px-3 py-1 rounded-full text-sm font-medium';

              badge.innerHTML = `<img src="${avatarUrl}" alt="${name}" class="h-5 w-5 rounded-full object-cover"><span>${name}</span>`;

              aiDirectoryList.appendChild(badge);

              if (d.id === PAIDAI_SYSTEM_AI_ID) {
                aiAvatarDisplay.innerHTML = `<img src="${avatarUrl}" alt="${name}" class="h-full w-full rounded-full object-cover">`;

                aiAvatarDisplay.title = `${name} (KAIP Security Check)`;
              }
            });
          },
          (error) => {
            console.error('Firestore AI Directory Listener Failed:', error);

            updateStatus(
              `ERROR: AI Directory Listener Failed. Check Console.`,
              true
            );
          }
        );
      }

      function setupClaimsListener() {
        if (!db || !userId) return;

        const claimsPath = `artifacts/${appId}/public/data/theory_claims`;

        const q = query(
          collection(db, claimsPath),
          orderBy('updatedAt', 'desc')
        );

        onSnapshot(
          q,
          (snapshot) => {
            claimsList.innerHTML = '';

            if (snapshot.size === 0) {
              claimsList.innerHTML =
                '<p class="text-gray-500 italic">No claims found. Be the first to add a theory!</p>';
            }

            snapshot.forEach((doc) => {
              const data = doc.data();

              const claimId = doc.id;

              // Check if the current user owns the claim for edit/delete permissions

              const isClaimOwner = data.ownerId === userId;

              const updatedAt = data.updatedAt || data.createdAt || new Date();

              const claimContainer = document.createElement('div');

              claimContainer.className =
                'bg-white p-4 rounded-lg border border-gray-200 shadow-sm';

              let contentHTML = `

                <div class="flex justify-between items-start mb-2">

                    <p class="font-medium text-gray-900 break-words flex-1 pr-4">${
                      data.text || 'No text.'
                    }</p>

                    <div class="flex space-x-2">

                        <button data-id="${claimId}" class="pin-to-hub-btn py-1 px-3 bg-blue-500 text-white text-sm font-semibold rounded-lg hover:bg-blue-600 transition duration-300 shadow-md">Pin to Hub</button>

                        ${
                          isClaimOwner
                            ? `<button data-id="${claimId}" class="edit-claim-btn py-1 px-3 bg-indigo-500 text-white text-sm font-semibold rounded-lg hover:bg-indigo-600 transition duration-300 shadow-md">Edit</button>

                            <button data-id="${claimId}" class="delete-claim-btn py-1 px-3 bg-red-500 text-white text-sm font-semibold rounded-lg hover:bg-red-600 transition duration-300 shadow-md">Delete</button>`
                            : ''
                        }

                    </div>

                </div>

                <p class="text-xs text-gray-500 mt-1">Last Updated: ${formatTimestamp(
                  updatedAt
                )} | Owner: ${data.ownerId.substring(0, 8)}... </p>

            `;

              claimContainer.innerHTML = contentHTML;

              claimsList.appendChild(claimContainer);
            });
          },
          (error) => {
            console.error('Firestore Claims Listener Failed:', error);

            updateStatus(`ERROR: Claims Listener Failed. Check Console.`, true);
          }
        );
      }

      // --- EVENT LISTENERS ---

      // Main Button Listener (Handles Save and Edit)

      addClaimButton.addEventListener('click', saveClaim);

      // Event delegation for Edit, Delete, and Pin buttons

      claimsList.addEventListener('click', (e) => {
        const target = e.target;

        const claimId = target.dataset.id;

        if (!claimId) return;

        if (target.classList.contains('edit-claim-btn')) {
          editClaim(claimId);
        } else if (target.classList.contains('delete-claim-btn')) {
          deleteClaim(claimId);
        } else if (target.classList.contains('pin-to-hub-btn')) {
          pinToHub(claimId);
        }
      });

      // ----------------------------------------------------------------------

      // 🚀 RUN INITIALIZATION

      // ----------------------------------------------------------------------

      initAndAuthenticate();
    </script>
  </body>
</html>
