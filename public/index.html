<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAIDAI Theory City Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="stickman_engine.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #eef2f6; }
        .card-shadow { box-shadow: 0 12px 24px -6px rgba(45, 55, 72, 0.1); }
        .ai-avatar {
            width: 64px;
            height: 64px;
            background-color: #eef2f6; 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 10px;
            color: #6b7280;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div id="root"></div>

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-start mb-6 border-b pb-4">
            <div>
                <h1 class="text-4xl font-extrabold text-gray-900 mb-2">Theory City Hub (Your Private Cards)</h1>
            </div>
            <div id="ai-avatar-display" class="ai-avatar float-right" title="System Avatar (KAIP Security Check)">
                System Avatar
            </div>
        </div>

        <div id="status-box-hub" class="p-3 mb-6 text-sm font-medium rounded-lg text-blue-800 bg-blue-100">
            Initializing Hub...
        </div>

        <div class="flex items-center justify-between border-b pb-4 mb-8">
            <p class="text-xl font-semibold text-gray-700">Your Personalized Live Feed</p>
            <a href="theory.html" class="py-2 px-4 bg-indigo-600 text-white font-semibold rounded-lg shadow-lg hover:bg-indigo-700 transition duration-300">
                Go to Theory App (View/Contribute Public Claims)
            </a>
        </div>
        
        <div id="card-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-gray-500 italic">Awaiting Hub data...</p>
        </div>
    </div>

    <script type="module">
        const FALLBACK_FIREBASE_CONFIG = {
            apiKey: "AIzaSyDosIufgrnOoe8LoFG-QLMC6cbBraaalf0", 
            authDomain: "paidaiworld-68886.firebaseapp.com",
            projectId: "paidaiworld-68886", 
            appId: "1:164023712177:web:d6419fcd1955960fe8e590",
            storageBucket: "paidaiworld-68886.firebasestorage.app",
            messagingSenderId: "164023712177",
            measurementId: "G-17MSF9E8GH"
        };
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'paidaiworld-68886';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : FALLBACK_FIREBASE_CONFIG;

        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, setLogLevel, doc, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        setLogLevel('debug');

        let app, db, auth, userId = null;
        const statusBox = document.getElementById('status-box-hub');
        const cardFeed = document.getElementById('card-feed');
        const aiAvatarDisplay = document.getElementById('ai-avatar-display');

        function updateStatus(message, isError = false) {
            statusBox.textContent = message;
            statusBox.className = `p-3 mb-6 text-sm font-medium rounded-lg ${isError ? 'text-red-800 bg-red-100 border border-red-300' : 'text-blue-800 bg-blue-100'}`;
        }

        async function initAndAuthenticate() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                await new Promise((resolve) => {
                    const unsubscribe = onAuthStateChanged(auth, (user) => {
                        if (user) {
                            unsubscribe();
                            userId = user.uid;
                            resolve();
                        }
                    });
                });
            } catch (error) {
                updateStatus(`Hub Initialization Failed: ${error.message}`, true);
                throw error;
            }
        }

        function setupHubListener() {
            if (!db || !userId) return;
            const hubPath = `artifacts/${appId}/users/${userId}/hub_cards`;
            onSnapshot(query(collection(db, hubPath)), (snapshot) => {
                cardFeed.innerHTML = snapshot.empty ? '<p class="text-gray-600 italic col-span-full">Hub empty. Pin a claim to start!</p>' : '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'bg-white p-5 rounded-xl card-shadow border-l-4 border-indigo-500';
                    card.innerHTML = `<p class="text-xs font-bold uppercase text-gray-600">${data.sourceApp || 'City'}</p><p class="text-gray-800 font-medium">${data.content || ''}</p>`;
                    cardFeed.appendChild(card);
                });
                updateStatus(`Hub active. Displaying ${snapshot.size} cards.`);
            });
        }

        initAndAuthenticate().then(() => {
            setupHubListener();
        });
    </script>
</body>
</html>
